[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shikishi"
dynamic = ["version"]
description = "Python application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.9",
]
download = ["gallery-dl>=1.30"]
ui = [
    "accelerate>=1.4",
    "diffusers>=0.32",
    "gradio>=5.0",
    "safetensors>=0.5",
    "torch>=2.6",
    "transformers>=4.48",
]

[project.scripts]
shikishi = "shikishi.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shikishi"]

[tool.hatch.version]
path = "src/shikishi/__init__.py"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["colab", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
# Preserve the cell-oriented canonical source; notebook drift has its own check.
exclude = ["kaggle/illustrious_xl_style_lora.py"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
files = ["src", "app.py", "studio"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
ignore_missing_imports = true
